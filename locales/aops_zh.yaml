help:
  local_header: "🧰 **AOPS 本地命令**"
  skill_header: "⚡ **技能命令**："
  command_lines: |-
    `/profile` -- 查看当前 profile 名称和 home 目录
    `/profile delete` -- 预览永久删除当前 named profile
    `/profile delete confirm <token>` -- 使用一次性确认码删除 profile
    `/skills` -- 列出已安装技能
    `/skills list` -- 列出已安装技能
    `/skills enable <name>` -- 启用已安装技能
    `/skills disable <name>` -- 禁用已安装技能
    `/skills set <name> <true|false>` -- 启用或禁用已安装技能
    `/toolsets` -- 查看或更新 AOPS 工具集
    `/toolsets list` -- 列出 AOPS 工具集
    `/toolsets enable <name>` -- 启用 AOPS 工具集
    `/toolsets disable <name>` -- 禁用 AOPS 工具集
    `/toolsets set <name> <true|false>` -- 启用或禁用 AOPS 工具集
    `/cron` -- 查看定时任务
    `/cron list [channel]` -- 查看定时任务，可按 tec01 或 anyi 筛选
    `/cron create {json}` -- 创建定时任务
    `/cron update <id|name> {json}` -- 更新定时任务
    `/cron pause <id|name>` -- 暂停定时任务
    `/cron resume <id|name>` -- 恢复定时任务
    `/cron trigger <id|name>` -- 立即触发定时任务
    `/cron remove <id|name>` -- 删除定时任务
    `/cron history <id> [tsMs]` -- 查看定时任务执行历史
    `/cron history before <id> [tsMs]` -- 查看锚点之前的执行历史
    `/cron history after <id> <tsMs>` -- 查看锚点之后的执行历史
    `/soul` -- 查看当前 SOUL.md 指令
    `/soul set {json}` -- 替换 SOUL.md 指令
    `/soul append {json}` -- 追加 SOUL.md 指令
    `/user` -- 查看当前 memories/USER.md 指令
    `/user set {json}` -- 替换 memories/USER.md 指令
    `/user append {json}` -- 追加 memories/USER.md 指令
    `/busy [queue|steer|interrupt|status]` -- 查看或切换 busy 输入策略
    `/memory` -- 查看或管理记忆设置
    `/memory status` -- 查看记忆、用户画像、预算和 provider 状态
    `/memory get [memory]` -- 查看完整 MEMORY.md 内容
    `/memory reset <memory|user|all>` -- 重置本地 MEMORY.md 和/或 USER.md
    `/memory memory_char_limit [chars]` -- 查看或设置 MEMORY.md 字符预算
    `/memory user_char_limit [chars]` -- 查看或设置 USER.md 字符预算
    `/memory enable <memory|user|all>` -- 开启内置记忆或用户画像
    `/memory disable <memory|user|all>` -- 关闭内置记忆或用户画像
    `/memory provider <status|enable [name]|disable>` -- 管理外部 memory provider
    `/event-center [status]` -- 查看当前事件中心上下文
    `/event-center use <eventId>` -- 为当前 AOPS channel 设置事件中心指导信息
    `/event-center clear` -- 清除当前 AOPS channel 的事件中心指导信息
    `/security` -- 查看当前审批策略
    `/security terminal [status]` -- 查看当前 profile 的终端命令策略
    `/security set <off|manual|smart>` -- 切换审批策略
